name: Backend verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - LAST_UPDATED.txt
  workflow_dispatch:
    inputs:
      verify_lessons:
        description: 'Run optional tutorial solution checks (owner request only)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: backend-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  keys-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Native PostgreSQL key roles, quotas and recovery (synthetic only)
        shell: bash
        run: |
          fixture="sefgh-keys-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker run --rm -d --name "$fixture" --label com.sefgh.test=keys --network none --memory 512m --cpus 2 -e POSTGRES_PASSWORD=fixture-only-local-password postgres@sha256:00bc86618629af00d2937fdc5a5d63db3ff8450acf52f0636ec813c7f4902929
          trap 'docker stop --time 1 "$fixture" >/dev/null' EXIT
          ready=false
          for attempt in {1..60}; do
            if docker exec "$fixture" pg_isready -h 127.0.0.1 -U postgres; then ready=true; break; fi
            sleep 0.25
          done
          test "$ready" = true
          node scripts/keys-postgres-test.mjs "$fixture"
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CGO_ENABLED: '1'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: backend/go.mod
          cache: false # Standard library only; no go.sum to cache.
      - run: npm ci
      # Errors fail the run (bug register R-043 fixed the last ones in
      # BUG-003). The remaining warnings are open register entries.
      - name: Lint
        run: npm run lint
      - run: npm run test:contracts
      - name: Backend race detector and vet
        working-directory: backend
        run: |
          go test -race -count=1 ./...
          go vet ./...
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then printf '%s\n' "$unformatted"; exit 1; fi
      - name: Lesson solutions (exercises intentionally remain unfinished)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_lessons }}
        working-directory: learn-go
        run: |
          go test -count=1 -tags solution ./...
          go vet -tags solution ./...
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then printf '%s\n' "$unformatted"; exit 1; fi
      - name: Build Go for the local forwarding probe
        working-directory: backend
        run: go build -o bin/api ./cmd/api
      - name: Production Next.js forwarding (local fake GitHub)
        run: node scripts/contracts/go-forwarding-probe.mjs ./backend/bin/api --production --phase2
      - name: Trending browser flows (local API fixtures)
        run: node scripts/trending-browser-probe.mjs --production
      - name: Show-once playground (synthetic sessions, no live keys)
        run: node scripts/keys-browser-probe.mjs
      - name: Playground default-off gate (separate production build)
        run: node scripts/keys-browser-probe.mjs --off
