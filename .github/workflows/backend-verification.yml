name: Backend verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - LAST_UPDATED.txt
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CGO_ENABLED: '1'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: backend/go.mod
          cache: false # Standard library only; no go.sum to cache.
      - run: npm ci
      # Errors fail the run (bug register R-043 fixed the last ones in
      # BUG-003). The remaining warnings are open register entries.
      - name: Lint
        run: npm run lint
      - run: npm run test:contracts
      - name: Backend race detector and vet
        working-directory: backend
        run: |
          go test -race -count=1 ./...
          go vet ./...
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then printf '%s\n' "$unformatted"; exit 1; fi
      - name: Lesson solutions (exercises intentionally remain unfinished)
        working-directory: learn-go
        run: |
          go test -count=1 -tags solution ./...
          go vet -tags solution ./...
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then printf '%s\n' "$unformatted"; exit 1; fi
      - name: Build Go for the local forwarding probe
        working-directory: backend
        run: go build -o bin/api ./cmd/api
      - name: Production Next.js forwarding (local fake GitHub)
        run: node scripts/contracts/go-forwarding-probe.mjs ./backend/bin/api --production
