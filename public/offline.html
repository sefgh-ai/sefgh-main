<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · SEFGH</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0; min-height: 100vh;
        display: flex; align-items: center; justify-content: center;
        background: #111318; color: #f8fafc;
        font: 400 15px/1.6 ui-sans-serif, system-ui, -apple-system, sans-serif;
        padding: 24px;
      }
      main { max-width: 28rem; text-align: center; }
      h1 { font-size: 1.5rem; margin: 0 0 .5rem; letter-spacing: -0.01em; }
      p { margin: 0 0 1.5rem; color: #94a3b8; }
      button {
        font: inherit; font-weight: 500; cursor: pointer;
        background: #3c83f6; color: #fff; border: 0;
        border-radius: .5rem; padding: .625rem 1.25rem;
      }
      button:hover { background: #2f6fd8; }
      button:focus-visible { outline: 2px solid #93b8fb; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>SEFGH needs a connection to search GitHub. Reconnect and try again.</p>
      <button type="button" onclick="location.reload()">Retry</button>
    </main>
  </body>
</html>
